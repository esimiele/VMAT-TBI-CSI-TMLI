:begin template case configuration:
%% non-myeloablative vmat tmli plan template
template name=TMLI (200 cGy)
% dose per fraction and number of fractions
dose per fraction=200
num fx=1
% add targets
% target id, Rx dose (cGy), plan id
add prescription target{PTV_TMLI,200,VMAT-TMLI}
%
%target to create ring from, margin, thickness, dose level, dose value presentation (Absolute or Relative)
create ring{PTV_TMLI,1.5,2.0,100}
%
%PTV_TMLI definition
%PTV_TMLI = [((Bones_Trunk – Bones_Face) + LymphNodes + SpinalCanal + Spleen) + 5mm] + [(Bones_Extrem) + 1cm] + [Rib + 7mm] – [Lungs+3mm] – [Kidneys +3mm] – [Heart+3mm] - [Eyes+3mm] – [Thyroid+3mm] – [Ovaries/Testes+2cm] cropped 3mm from skin
%
%Add TS manipulations
%target derivations (structure a id, margin for structure a [cm], operations, structure b id, margin for structure b [cm], output structure id, temporary structure?)
add target derivation{Bones_Trunk,[uniform,0],crop,Bones_Face,[uniform,0],PTV_TMLI,false}
add target derivation{PTV_TMLI,[uniform,0],union,LymphNodes,[uniform,0],PTV_TMLI,false}
add target derivation{PTV_TMLI,[uniform,0],union,SpinalCanal,[uniform,0],PTV_TMLI,false}
add target derivation{PTV_TMLI,[uniform,0],union,Spleen,[uniform,0],PTV_TMLI,false}
add target derivation{PTV_TMLI,[uniform,0],union,PTV_TMLI,[uniform,0.5],PTV_TMLI,false}
add target derivation{PTV_TMLI,[uniform,0],union,Rib,[uniform,0.7],PTV_TMLI,false}
add target derivation{PTV_TMLI,[uniform,0],union,Bones_Extrem,[uniform,1.0],PTV_TMLI,false}
add target derivation{PTV_TMLI,[uniform,0],crop,Lungs,[uniform,0.3],PTV_TMLI,false}
add target derivation{PTV_TMLI,[uniform,0],crop,Kidneys,[uniform,0.3],PTV_TMLI,false}
add target derivation{PTV_TMLI,[uniform,0],crop,Eyes,[uniform,0.3],PTV_TMLI,false}
add target derivation{PTV_TMLI,[uniform,0],crop,Heart,[uniform,0.3],PTV_TMLI,false}
add target derivation{PTV_TMLI,[uniform,0],crop,Thyroid,[uniform,0.3],PTV_TMLI,false}
add target derivation{PTV_TMLI,[uniform,0],crop,Ovaries,[uniform,2.0],PTV_TMLI,false}
add target derivation{PTV_TMLI,[uniform,0],crop,Testes,[uniform,2.0],PTV_TMLI,false}
add target derivation{PTV_TMLI,[uniform,0],Intersection,body,[uniform,-0.3],PTV_TMLI,false}
%
add opt structure derivation{Lungs,[uniform,-1.0],CopyContractExpand,Lungs-1.0cm,false}
add opt structure derivation{Lungs,[uniform,-2.0],CopyContractExpand,Lungs-2.0cm,false}
add opt structure derivation{Kidneys,[uniform,-1.0],CopyContractExpand,Kidneys-1.0cm,false}
add opt structure derivation{Liver,[uniform,-1.0],CopyContractExpand,Liver-1.0cm,false}
add opt structure derivation{Liver,[uniform,-2.0],CopyContractExpand,Liver-2.0cm,false}
add opt structure derivation{Brain,[uniform,-0.5],CopyContractExpand,Brain-0.5cm,false}
add opt structure derivation{Brain,[uniform,-1.0],CopyContractExpand,Brain-1.0cm,false}
add opt structure derivation{Brain,[uniform,-2.0],CopyContractExpand,Brain-2.0cm,false}
add opt structure derivation{Brain,[uniform,-3.0],CopyContractExpand,Brain-3.0cm,false}
add opt structure derivation{Heart,[uniform,-1.0],CopyContractExpand,Heart-1.0cm,false}
add opt structure derivation{Heart,[uniform,-2.0],CopyContractExpand,Heart-2.0cm,false}
add opt structure derivation{Testes,[uniform,-1.0],CopyContractExpand,Testes-1.0cm,false}
%
% add optimization constraints
add opt constraint{PTV_TMLI,Lower,200.0,100.0,100}
add opt constraint{PTV_TMLI,Upper,210.0,0.0,100}
add opt constraint{PTV_TMLI,Lower,201.0,98.0,100}
add opt constraint{Brain,Mean,150.0,0.0,40}
add opt constraint{Brain-0.5cm,Mean,115.0,0.0,50}
add opt constraint{Brain-1.0cm,Mean,80.0,0.0,60}
add opt constraint{Brain-2.0cm,Mean,60.0,0.0,60}
add opt constraint{Brain-3.0cm,Mean,50.0,0.0,70}
add opt constraint{Liver,Mean,100.0,0.0,50}
add opt constraint{Liver-1.0cm,Mean,75.0,0.0,50}
add opt constraint{Liver-2.0cm,Mean,50.0,0.0,50}
add opt constraint{Bladder,Mean,100.0,0.0,50}
add opt constraint{Breasts,Mean,100.0,0.0,50}
add opt constraint{Esophagus,Upper,205.0,0.0,50}
add opt constraint{Eyes,Mean,100.0,0.0,60}
add opt constraint{Glnd_submands,Mean,75.0,0.0,60}
add opt constraint{Heart,Mean,90.0,0.0,60}
add opt constraint{Heart-1.0cm,Mean,75.0,0.0,60}
add opt constraint{Heart-2.0cm,Mean,50.0,0.0,50}
add opt constraint{Bag_Bowel,Upper,205.0,0.0,50}
add opt constraint{Bag_Bowel,Mean,100.0,0.0,60}
add opt constraint{Kidneys,Mean,100.0,0.0,65}
add opt constraint{Kidneys-1.0cm,Mean,75.0,0.0,65}
add opt constraint{Larynx,Mean,125.0,0.0,50}
add opt constraint{Lenses,Upper,100.0,0.0,60}
add opt constraint{Lenses,Mean,75.0,0.0,70}
add opt constraint{Lungs,Mean,90.0,0.0,75}
add opt constraint{Lungs-1.0cm,Mean,70.0,0.0,75}
add opt constraint{Lungs-2.0cm,Mean,50.0,0.0,75}
add opt constraint{Cavity_Oral,Mean,40.0,0.0,60}
add opt constraint{Testes,Mean,50.0,0.0,75}
add opt constraint{Testes,Upper,80.0,0.0,75}
add opt constraint{Testes-1.0cm,Mean,25.0,0.0,50}
add opt constraint{Ovaries,Mean,50.0,0.0,75}
add opt constraint{Ovaries,Upper,80.0,0.0,75}
add opt constraint{Parotids,Mean,90.0,0.0,60}
add opt constraint{Rectum,Mean,100.0,0.0,50}
add opt constraint{Stomach,Mean,90.0,0.0,50}
add opt constraint{Thyroid,Mean,90.0,0.0,60}
add opt constraint{Uterus,Mean,100.0,0.0,50}
%
%plan objectives
add plan objective{PTV_TMLI,Lower,100.0,90.0,Relative}
add plan objective{PTV_TMLI,Upper,120.0,0.0,Relative}
add plan objective{PTV_TMLI,Upper,110.0,5.0,Relative}
add plan objective{Brain,Mean,55.0,0.0,Relative}
add plan objective{Liver,Mean,60.0,0.0,Relative}
add plan objective{Bladder,Mean,63.0,0.0,Relative}
add plan objective{Breasts,Mean,75.0,0.0,Relative}
add plan objective{Esophagus,Mean,40.0,0.0,Relative}
add plan objective{Eyes,Mean,33.0,0.0,Relative}
add plan objective{Heart,Mean,50.0,0.0,Relative}
add plan objective{Bag_Bowel,Mean,50.0,0.0,Relative}
add plan objective{Kidneys,Mean,50.0,0.0,Relative}
add plan objective{Larynx,Mean,40.0,0.0,Relative}
add plan objective{Lenses,Mean,18.0,0.0,Relative}
add plan objective{Lungs,Mean,50.0,0.0,Relative}
add plan objective{Cavity_Oral,Mean,25.0,0.0,Relative}
add plan objective{Ovaries,Mean,50.0,0.0,Relative}
add plan objective{Parotids,Mean,45.0,0.0,Relative}
add plan objective{Rectum,Mean,40.0,0.0,Relative}
add plan objective{Rectum,Mean,40.0,0.0,Relative}
add plan objective{Thyroid,Mean,50.0,0.0,Relative}
%
%be careful when adding these. It significantly slows down the plan quality evaluation at the end of each loop iteration
%ID, lower dose level, upper dose level, volume (%), priority, conditions 
%(empty array indicates ts structure should always be added). All conditions are AND
add optimization TS structure{TS_cooler130,130.0,120.0,0.0,70,{Dmax > 130 %}}
add optimization TS structure{TS_cooler120,120.0,115.0,0.0,60,{Dmax > 120 %}}
add optimization TS structure{TS_cooler115,115.0,103.0,0.0,60,{finalOpt,Dmax > 115 %}}
add optimization TS structure{TS_heater90,90.0,100.0,100.0,50,{}}
%add optimization TS structure{TS_heater80,80.0,90.0,100.0,70,{Dmax > 120 %}}
%add optimization TS structure{TS_heater70,70.0,80.0,100.0,80,{Dmax > 130 %,V 110 % > 20.0 %}}
%
%
%additional plan dose info that should be printed after each iteration of the loop
%structure id (or can put '<plan>' to get the plan dose value), metric requested (Dmax, Dmin, D<vol %>, V<dose %>), return value representation (dose or volume as absolute or relative)
add requested plan metric{<plan>,Dmax,%}
add requested plan metric{<target>,Dmax,%}
add requested plan metric{<target>,Dmin,%}
add requested plan metric{<target>,DoseAtVolume,90,%,%}
add requested plan metric{<target>,VolumeAtDose,90,%,%}
add requested plan metric{<target>,VolumeAtDose,95,%,%}
add requested plan metric{<target>,VolumeAtDose,110,%,%}
add requested plan metric{<target>,VolumeAtDose,120,%,%}
%
:end template case configuration: