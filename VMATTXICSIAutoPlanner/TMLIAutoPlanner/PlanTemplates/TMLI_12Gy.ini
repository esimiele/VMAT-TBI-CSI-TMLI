add opt constraint{Liver-2.0cm,Mean,450.0,0.0,50}
add opt constraint{Bladder,Mean,600.0,0.0,50}
add opt constraint{Breasts,Mean,900.0,0.0,50}
add opt constraint{Esophagus,Mean,450.0,0.0,50}
add opt constraint{Eyes,Mean,350.0,0.0,50}
add opt constraint{Heart,Mean,550.0,0.0,70}
add opt constraint{Heart-1.0,Mean,450.0,0.0,60}
add opt constraint{Heart-2.0,Mean,350.0,0.0,50}
add opt constraint{Bag_Bowel,Upper,1210.0,0.0,50}
add opt constraint{Bag_Bowel,Mean,550.0,0.0,50}
