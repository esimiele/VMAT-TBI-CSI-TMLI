%% myeloablative vmat tmli plan template
template name=TMLI (1200 cGy)
% dose per fraction and number of fractions
dose per fraction=200
num fx=6
% add targets
% target id, Rx dose (cGy), plan id
add target{PTV_TMLI,1200,VMAT-TMLI}
%
%add tuning structures
%syntax: DICOM type (all caps), structure
create preliminary target{PTV,PTV_TMLI}
%
%target to create ring from, margin, thickness, dose level, dose value presentation (Absolute or Relative)
create ring{PTV_TMLI,1.5,2.0,600}
%
%PTV_TMLI definition
%PTV_TMLI = [((Bones_Trunk – Bones_Face) + LymphNodes + SpinalCanal + Spleen + Testes) + 5mm] + [Rib + 7mm] + [(Bones_Extrem) + 1cm] – [Lungs +3mm] – [Kidneys +3mm] – [Eyes+3mm] - [ovaries+20mm]
%
%Add TS manipulations
add TS manipulation{Eyes,Crop target from structure,0.3}
add TS manipulation{Lungs,Crop target from structure,0.3}
add TS manipulation{Kidneys,Crop target from structure,0.3}
add TS manipulation{Ovaries,Crop target from structure,2.0}
add TS manipulation{Lungs,ContourSubStructure,-1.0}
add TS manipulation{Lungs,ContourSubStructure,-2.0}
add TS manipulation{Kidneys,ContourSubStructure,-1.0}
add TS manipulation{Liver,ContourSubStructure,-1.0}
add TS manipulation{Liver,ContourSubStructure,-2.0}
add TS manipulation{Brain,ContourSubStructure,-1.0}
add TS manipulation{Brain,ContourSubStructure,-2.0}
add TS manipulation{Heart,ContourSubStructure,-1.0}
add TS manipulation{Heart,ContourSubStructure,-2.0}
%add TS manipulation{Testes,ContourSubStructure,-1.0}
%
% add optimization constraints
add opt constraint{PTV_TMLI,Lower,1200.0,100.0,100}
add opt constraint{PTV_TMLI,Upper,1212.0,0.0,100}
add opt constraint{PTV_TMLI,Lower,1202.0,98.0,100}
add opt constraint{Brain,Mean,600.0,0.0,60}
