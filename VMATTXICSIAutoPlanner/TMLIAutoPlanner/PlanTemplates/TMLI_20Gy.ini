%% myeloablative vmat tmli plan template
template name=TMLI (2000 cGy)
% dose per fraction and number of fractions
dose per fraction=200
num fx=10
% add targets
% target id, Rx dose (cGy), plan id
add prescription target{PTV_TMLI_12,1200,VMAT-TMLI}
add prescription target{PTV_TMLI_20,2000,VMAT-TMLI}
%
%
%target to create ring from, margin, thickness, dose level, dose value presentation (Absolute or Relative)
create ring{TS_PTV_all,1.5,2.0,600,[uniform,0],crop,PTV_TMLI_20,[uniform,2.0]}
%
%PTV_TMLI definition
%PTV_TMLI_20 = [((Bones_Trunk – Bones_Face) + LymphNodes + SpinalCanal + Spleen + Testes) + 5mm] + [(Bones_Extrem) + 1cm] - [Rib + 7mm] – [Lungs +5mm] – [Kidneys +5mm] – [Eyes+2 cm] - [Heart+5mm] – [Esophagus + 5mm]  - [Larynx + 5mm] - [Thyroid + 5mm]   – [Ovaries +2cm] cropped 3mm from skin
%PTV_TMLI_12 = [[(Brain + Liver) + 5mm] + [Rib + 7mm]] – [Lungs +5mm] – [Kidneys +5mm] – [Eyes+2 cm] - [Heart+5mm] – [Esophagus + 5mm]  - [Larynx + 5mm] - [Thyroid + 5mm]
%TS_TMLI_20 crop matchline and anything beyond matchline
%TS_TMLI_12 = PTV_TMLI_12 – [PTV_TMLI_20 + 5mm]
%
%
%target derivations (structure a id, margin for structure a [cm], operations, structure b id, margin for structure b [cm], output structure id, temporary structure?)
%20 Gy target
add target derivation{Bones_Trunk,[uniform,0],crop,Bones_Face,[uniform,0],PTV_TMLI_20,false}
add target derivation{PTV_TMLI_20,[uniform,0],union,LymphNodes,[uniform,0],PTV_TMLI_20,false}
add target derivation{PTV_TMLI_20,[uniform,0],union,SpinalCanal,[uniform,0],PTV_TMLI_20,false}
add target derivation{PTV_TMLI_20,[uniform,0],union,Spleen,[uniform,0],PTV_TMLI_20,false}
add target derivation{PTV_TMLI_20,[uniform,0],union,Testes,[uniform,0],PTV_TMLI_20,false}
add target derivation{PTV_TMLI_20,[uniform,0],union,PTV_TMLI_20,[uniform,0.5],PTV_TMLI_20,false}
add target derivation{PTV_TMLI_20,[uniform,0],union,Bones_Extrem,[uniform,1.0],PTV_TMLI_20,false}
add target derivation{PTV_TMLI_20,[uniform,0],crop,Rib,[uniform,0.7],PTV_TMLI_20,false}
add target derivation{PTV_TMLI_20,[uniform,0],crop,Lungs,[uniform,0.5],PTV_TMLI_20,false}
add target derivation{PTV_TMLI_20,[uniform,0],crop,Kidneys,[uniform,0.5],PTV_TMLI_20,false}
add target derivation{PTV_TMLI_20,[uniform,0],crop,Eyes,[uniform,2.0],PTV_TMLI_20,false}
add target derivation{PTV_TMLI_20,[uniform,0],crop,Heart,[uniform,0.5],PTV_TMLI_20,false}
add target derivation{PTV_TMLI_20,[uniform,0],crop,Esophagus,[uniform,0.5],PTV_TMLI_20,false}
add target derivation{PTV_TMLI_20,[uniform,0],crop,Larynx,[uniform,0.5],PTV_TMLI_20,false}
add target derivation{PTV_TMLI_20,[uniform,0],crop,Thyroid,[uniform,0.5],PTV_TMLI_20,false}
add target derivation{PTV_TMLI_20,[uniform,0],crop,Ovaries,[uniform,2.0],PTV_TMLI_20,false}
add target derivation{PTV_TMLI_20,[uniform,0],Intersection,body,[uniform,-0.3],PTV_TMLI_20,false}
%
%12Gy target
add target derivation{Brain,[uniform,0],union,Liver,[uniform,0],PTV_TMLI_12,false}
