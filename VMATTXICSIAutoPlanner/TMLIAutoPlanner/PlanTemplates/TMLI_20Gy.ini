:begin template case configuration:
%% myeloablative vmat tmli plan template
template name=TMLI (2000 cGy)
% dose per fraction and number of fractions
dose per fraction=200
num fx=10
% add targets
% target id, Rx dose (cGy), plan id
add prescription target{PTV_TMLI_12,1200,VMAT-TMLI}
add prescription target{PTV_TMLI_20,2000,VMAT-TMLI}
%
%add tuning structures
%syntax: DICOM type (all caps), structure
create preliminary target{PTV,PTV_TMLI_12}
create preliminary target{PTV,PTV_TMLI_20}
%
%target to create ring from, margin, thickness, dose level, dose value presentation (Absolute or Relative)
create ring{PTV_TMLI,1.5,2.0,600}
manipulate ring{TS_ring600,crop structure from target,PTV_TMLI_20,2.0}
%
%PTV_TMLI definition
%PTV_TMLI_20 = [((Bones_Trunk – Bones_Face) + LymphNodes + SpinalCanal + Spleen + Testes) + 5mm] + [(Bones_Extrem) + 1cm] - [Rib + 7mm] – [Lungs +5mm] – [Kidneys +5mm] – [Eyes+2 cm] - [Heart+5mm] – [Esophagus + 5mm]  - [Larynx + 5mm] - [Thyroid + 5mm]   – [Ovaries +2cm] cropped 3mm from skin
%PTV_TMLI_12 = [[(Brain + Liver) + 5mm] + [Rib + 7mm]] – [Lungs +5mm] – [Kidneys +5mm] – [Eyes+2 cm] - [Heart+5mm] – [Esophagus + 5mm]  - [Larynx + 5mm] - [Thyroid + 5mm]
%TS_TMLI_20 crop matchline and anything beyond matchline
%TS_TMLI_12 = PTV_TMLI_12 – [PTV_TMLI_20 +5mm]
%
%
%target derivations (structure a id, margin for structure a [cm], operations, structure b id, margin for structure b [cm], output structure id, temporary structure?)
%20 Gy target
add target derivation{Bones_Trunk,[uniform,0],crop,Bones_Face,[uniform,0],PTV_TMLI_20,false}
add target derivation{PTV_TMLI_20,[uniform,0],union,LymphNodes,[uniform,0],PTV_TMLI_20,false}
add target derivation{PTV_TMLI_20,[uniform,0],union,SpinalCanal,[uniform,0],PTV_TMLI_20,false}
add target derivation{PTV_TMLI_20,[uniform,0],union,Spleen,[uniform,0],PTV_TMLI_20,false}
add target derivation{PTV_TMLI_20,[uniform,0],union,Testes,[uniform,0],PTV_TMLI_20,false}
add target derivation{PTV_TMLI_20,[uniform,0],union,PTV_TMLI_20,[uniform,0.5],PTV_TMLI_20,false}
add target derivation{PTV_TMLI_20,[uniform,0],union,Bones_Extrem,[uniform,1.0],PTV_TMLI_20,false}
add target derivation{PTV_TMLI_20,[uniform,0],crop,Rib,[uniform,0.7],PTV_TMLI_20,false}
add target derivation{PTV_TMLI_20,[uniform,0],crop,Lungs,[uniform,0.5],PTV_TMLI_20,false}
add target derivation{PTV_TMLI_20,[uniform,0],crop,Kidneys,[uniform,0.5],PTV_TMLI_20,false}
add target derivation{PTV_TMLI_20,[uniform,0],crop,Eyes,[uniform,2.0],PTV_TMLI_20,false}
add target derivation{PTV_TMLI_20,[uniform,0],crop,Heart,[uniform,0.5],PTV_TMLI_20,false}
add target derivation{PTV_TMLI_20,[uniform,0],crop,Esophagus,[uniform,0.5],PTV_TMLI_20,false}
add target derivation{PTV_TMLI_20,[uniform,0],crop,Larynx,[uniform,0.5],PTV_TMLI_20,false}
add target derivation{PTV_TMLI_20,[uniform,0],crop,Thyroid,[uniform,0.5],PTV_TMLI_20,false}
add target derivation{PTV_TMLI_20,[uniform,0],crop,Ovaries,[uniform,2.0],PTV_TMLI_20,false}
add target derivation{PTV_TMLI_20,[uniform,0],union,body,[uniform,-0.3],PTV_TMLI_20,false}
%
%12Gy target
add target derivation{Brain,[uniform,0],union,Liver,[uniform,0],PTV_TMLI_12,false}
add target derivation{PTV_TMLI_12,[uniform,0],union,PTV_TMLI_12,[uniform,0.5],PTV_TMLI_12,false}
add target derivation{PTV_TMLI_12,[uniform,0],union,Rib,[uniform,0.7],PTV_TMLI_12,false}
add target derivation{PTV_TMLI_12,[uniform,0],crop,Lungs,[uniform,0.5],PTV_TMLI_12,false}
add target derivation{PTV_TMLI_12,[uniform,0],crop,Kidneys,[uniform,0.5],PTV_TMLI_12,false}
add target derivation{PTV_TMLI_12,[uniform,0],crop,Eyes,[uniform,2.0],PTV_TMLI_12,false}
add target derivation{PTV_TMLI_12,[uniform,0],crop,Heart,[uniform,0.5],PTV_TMLI_12,false}
add target derivation{PTV_TMLI_12,[uniform,0],crop,Esophagus,[uniform,0.5],PTV_TMLI_12,false}
add target derivation{PTV_TMLI_12,[uniform,0],crop,Larynx,[uniform,0.5],PTV_TMLI_12,false}
add target derivation{PTV_TMLI_12,[uniform,0],crop,Thyroid,[uniform,0.5],PTV_TMLI_12,false}
%
add opt structure derivation{Lungs,[uniform,0],union,Lungs,[uniform,-1.0],Lungs-1.0cm,false}
add opt structure derivation{Lungs,[uniform,0],union,Lungs,[uniform,-2.0],Lungs-2.0cm,false}
add opt structure derivation{Kidneys,[uniform,0],union,Kidneys,[uniform,-1.0],Kidneys-1.0cm,false}
add opt structure derivation{Liver,[uniform,0],union,Liver,[uniform,-1.0],Liver-1.0cm,false}
add opt structure derivation{Liver,[uniform,0],union,Liver,[uniform,-2.0],Liver-2.0cm,false}
add opt structure derivation{Brain,[uniform,0],union,Brain,[uniform,-0.5],Brain-0.5cm,false}
add opt structure derivation{Brain,[uniform,0],union,Brain,[uniform,-1.0],Brain-1.0cm,false}
add opt structure derivation{Brain,[uniform,0],union,Brain,[uniform,-2.0],Brain-2.0cm,false}
add opt structure derivation{Brain,[uniform,0],union,Brain,[uniform,-3.0],Brain-3.0cm,false}
add opt structure derivation{Heart,[uniform,0],union,Heart,[uniform,-1.0],Heart-1.0cm,false}
add opt structure derivation{Heart,[uniform,0],union,Heart,[uniform,-2.0],Heart-2.0cm,false}
%
%
%Add TS manipulations
%20 Gy target
add TS manipulation{PTV_TMLI_20,Rib,Crop target from structure,0.7}
add TS manipulation{PTV_TMLI_20,Eyes,Crop target from structure,2.0}
add TS manipulation{PTV_TMLI_20,Lungs,Crop target from structure,0.5}
add TS manipulation{PTV_TMLI_20,Kidneys,Crop target from structure,0.5}
add TS manipulation{PTV_TMLI_20,Thyroid,Crop target from structure,0.5}
add TS manipulation{PTV_TMLI_20,Heart,Crop target from structure,0.5}
add TS manipulation{PTV_TMLI_20,Esophagus,Crop target from structure,0.5}
add TS manipulation{PTV_TMLI_20,Larynx,Crop target from structure,0.5}
add TS manipulation{PTV_TMLI_20,Ovaries,Crop target from structure,2.0}
%12 Gy target
add target TS manipulation{PTV_TMLI_12,Rib,Union with target,0.7}
add target TS manipulation{PTV_TMLI_12,Eyes,Crop target from structure,2.0}
add target TS manipulation{PTV_TMLI_12,Lungs,Crop target from structure,0.5}
add target TS manipulation{PTV_TMLI_12,Kidneys,Crop target from structure,0.5}
add target TS manipulation{PTV_TMLI_12,Thyroid,Crop target from structure,0.5}
add target TS manipulation{PTV_TMLI_12,Heart,Crop target from structure,0.5}
add target TS manipulation{PTV_TMLI_12,Esophagus,Crop target from structure,0.5}
add target TS manipulation{PTV_TMLI_12,Larynx,Crop target from structure,0.5}
add target TS manipulation{PTV_TMLI_20,PTV_TMLI_12,Crop target from structure,0.5}
%OARs
add OAR TS manipulation{Lungs,ContourSubStructure,-1.0}
add OAR TS manipulation{Lungs,ContourSubStructure,-2.0}
add OAR TS manipulation{Kidneys,ContourSubStructure,-1.0}
add OAR TS manipulation{Liver,ContourSubStructure,-1.0}
add OAR TS manipulation{Liver,ContourSubStructure,-2.0}
add OAR TS manipulation{Liver,ContourSubStructure,-3.0}
add OAR TS manipulation{Brain,ContourSubStructure,-0.5}
add OAR TS manipulation{Brain,ContourSubStructure,-1.0}
add OAR TS manipulation{Brain,ContourSubStructure,-2.0}
add OAR TS manipulation{Brain,ContourSubStructure,-3.0}
add OAR TS manipulation{Heart,ContourSubStructure,-1.0}
add OAR TS manipulation{Heart,ContourSubStructure,-2.0}
%
% add optimization constraints
add opt constraint{PTV_TMLI,Lower,1200.0,100.0,100}
add opt constraint{PTV_TMLI,Upper,1260.0,0.0,100}
add opt constraint{PTV_TMLI,Lower,1206.0,98.0,100}
add opt constraint{Brain,Mean,900.0,0.0,40}
add opt constraint{Brain-0.5cm,Mean,690.0,0.0,50}
add opt constraint{Brain-1.0cm,Mean,480.0,0.0,60}
add opt constraint{Brain-2.0cm,Mean,360.0,0.0,60}
add opt constraint{Brain-3.0cm,Mean,300.0,0.0,70}
add opt constraint{Liver,Mean,600.0,0.0,50}
add opt constraint{Liver-1.0cm,Mean,450.0,0.0,50}
add opt constraint{Liver-2.0cm,Mean,300.0,0.0,50}
add opt constraint{Larynx,Mean,500.0,0.0,50}
add opt constraint{Bladder,Mean,600.0,0.0,50}
add opt constraint{Breasts,Mean,600.0,0.0,50}
add opt constraint{Esophagus,Upper,1212.0,0.0,50}
add opt constraint{Esophagus,Mean,800.0,0.0,60}
add opt constraint{Eyes,Mean,600.0,0.0,70}
add opt constraint{Glnd_submands,Mean,450.0,0.0,50}
add opt constraint{Heart,Mean,540.0,0.0,60}
add opt constraint{Heart-1.0,Mean,400.0,0.0,60}
add opt constraint{Heart-2.0,Mean,300.0,0.0,65}
add opt constraint{Bag_Bowel,Upper,1230.0,0.0,50}
add opt constraint{Bag_Bowel,Mean,600.0,0.0,50}
add opt constraint{Kidneys,Mean,600.0,0.0,65}
add opt constraint{Kidneys-1.0cm,Mean,450.0,0.0,65}
add opt constraint{Lenses,Mean,400.0,0.0,70}
add opt constraint{Lenses,Upper,500.0,0.0,75}
add opt constraint{Lungs,Mean,540.0,0.0,75}
add opt constraint{Lungs-1.0cm,Mean,420.0,0.0,75}
add opt constraint{Lungs-2.0cm,Mean,300.0,0.0,75}
add opt constraint{Cavity_Oral,Mean,240.0,0.0,60}
add opt constraint{Ovaries,Mean,300.0,0.0,75}
add opt constraint{Ovaries,Upper,480.0,0.0,75}
add opt constraint{Parotids,Mean,540.0,0.0,50}
add opt constraint{Rectum,Mean,600.0,0.0,50}
add opt constraint{Stomach,Mean,540.0,0.0,50}
add opt constraint{Thyroid,Mean,750.0,0.0,50}
%
%plan objectives
add plan objective{PTV_TMLI,Lower,100.0,90.0,Relative}
add plan objective{PTV_TMLI,Upper,120.0,0.0,Relative}
add plan objective{PTV_TMLI,Upper,110.0,5.0,Relative}
add plan objective{Brain,Mean,55.0,0.0,Relative}
add plan objective{Liver,Mean,60.0,0.0,Relative}
add plan objective{Bladder,Mean,63.0,0.0,Relative}
